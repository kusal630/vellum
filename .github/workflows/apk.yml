name: APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # Action default ("tools platform-tools") installs the long-removed
          # "tools" package and fails the step; platform-tools ships preinstalled.
          packages: platform-tools
      - name: Gradle wrapper sanity
        run: ./gradlew -v
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Assemble release APK
        env:
          VELLUM_STORE_FILE: ${{ secrets.VELLUM_STORE_FILE }}
          VELLUM_STORE_PASSWORD: ${{ secrets.VELLUM_STORE_PASSWORD }}
          VELLUM_KEY_ALIAS: ${{ secrets.VELLUM_KEY_ALIAS }}
          VELLUM_KEY_PASSWORD: ${{ secrets.VELLUM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
